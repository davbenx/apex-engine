[pytest]
# Apex & Convex Institutional Test Suite Configuration
# Configurazione unificata e lean: esecuzione istantanea e senza attrito sia dalla root che da CI.
testpaths = validation_suite
python_files = test_*.py
pythonpath = . validation_suite/framework
norecursedirs =
    .git
    .venv
    research
    scratch
    validation_suite/comparative_studies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
addopts = -v --strict-markers
