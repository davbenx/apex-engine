[pytest]
# Discovery: solo la parte veloce/deterministica (framework/ + kelly_stack/ +
# core_regression/). comparative_studies/ resta fuori di proposito — sono
# script di ricerca lenti (minuti, rete, cache prezzi), non un gate di CI:
# si lanciano a mano con `python validation_suite/comparative_studies/<script>.py`.
testpaths =
    framework
    kelly_stack
    core_regression
python_files = test_*.py
