[pytest]
# Configurazione interna a validation_suite/ per esecuzione da sotto-directory
testpaths =
    framework
    kelly_stack
    core_regression
    datasets
python_files = test_*.py
pythonpath = .. ../validation_suite/framework
norecursedirs =
    comparative_studies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
addopts = -v --strict-markers
