name: R&D Backtester

on:
  workflow_dispatch: # Solo manuale

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pandas numpy yfinance
      - name: Run Scientific Backtest
        run: python research/backtester.py
