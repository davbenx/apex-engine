name: Diagnose Telegram

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Telegram Diagnostics
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'PYEOF'
          import os, urllib.request, urllib.parse, json

          token = os.environ.get("TELEGRAM_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          print(f"Chat ID secret value: {chat_id}")

          msg = "Verifica automatica: Secret TELEGRAM_CHAT_ID allineato con successo."
          data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode('utf-8')
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
          with urllib.request.urlopen(req) as resp:
              print("SUCCESS:", resp.read().decode())
          PYEOF
