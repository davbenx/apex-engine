name: Diagnose Telegram

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Telegram Diagnostics
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'PYEOF'
          import os, urllib.request, urllib.parse, json

          token = os.environ.get("TELEGRAM_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          print(f"Chat ID raw length: {len(chat_id)}, repr: {repr(chat_id)[:4]}...{repr(chat_id)[-4:]}")

          # Check getUpdates
          try:
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/getUpdates")
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
                  print("getUpdates count:", len(data.get("result", [])))
                  for upd in data.get("result", [])[-5:]:
                      msg = upd.get("message") or upd.get("channel_post") or upd.get("my_chat_member", {})
                      chat = msg.get("chat", {})
                      print("Found update chat:", chat.get("id"), chat.get("type"), chat.get("title") or chat.get("username"))
          except Exception as e:
              print("getUpdates Exception:", e)
          PYEOF
