name: Diagnose Telegram

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Telegram Diagnostics
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python - << 'PYEOF'
          import os, urllib.request, urllib.parse, json

          token = os.environ.get("TELEGRAM_TOKEN", "").strip()
          target_chat_id = "-1004387972246"

          msg_full = (
              "*APEX ENGINE* · 19 Sep 2026\n\n"
              "*ORDINI DA ESEGUIRE*\n"
              "• RIDUZIONE: BTC | Riallocazione (-1.1%) | Prezzo: $81,679.50\n\n"
              "*REGIMI DI MERCATO*\n"
              "• Azioni: [ON] 85%\n"
              "• Cryptovalute: [ON] 15%\n"
              "• Oro: [OFF] 0%\n"
              "• Obbligazioni: [OFF] 0%\n"
              "• Liquidità: [—] 0%\n\n"
              "Quote, controvalori e dettagli operativi su Dashboard."
          )
          try:
              data = urllib.parse.urlencode({"chat_id": target_chat_id, "text": msg_full, "parse_mode": "Markdown"}).encode('utf-8')
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
              with urllib.request.urlopen(req) as resp:
                  print("TARGET CHAT SUCCESS:", resp.read().decode())
          except urllib.error.HTTPError as e:
              print(f"TARGET CHAT HTTPError {e.code}:", e.read().decode())
          except Exception as e:
              print("TARGET CHAT Exception:", e)
          PYEOF
