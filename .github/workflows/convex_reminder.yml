name: Promemoria Mensile Convex Stack

on:
  schedule:
    - cron: '0 8 1 * *' # Il 1° di ogni mese alle 08:00 UTC
  workflow_dispatch: # Permette avvio manuale

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Invia promemoria Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python convex_telegram_reminder.py
