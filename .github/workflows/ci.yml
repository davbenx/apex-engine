name: Test Suite CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # I test di core_regression/ vivono sotto validation_suite/ ma importano i moduli
      # di produzione (backend, apex_v2_engine, convex_engine, ...) dalla root del repo.
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run Apex-Convex Ecosystem Tests
        run: |
          python -m unittest validation_suite/core_regression/test_apex_convex.py
      - name: Run Apex V2 Engine Tests
        run: |
          python validation_suite/core_regression/test_apex_v2_engine.py
      - name: Run Backend Execution Tests
        run: |
          python validation_suite/core_regression/test_backend.py
      - name: Run Kelly Stack Validation Suite
        run: |
          python -m pytest validation_suite/kelly_stack/ -q
      - name: Test Convex Telegram Dry Run
        run: |
          python convex_telegram_reminder.py --dry-run
