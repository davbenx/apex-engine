name: Test Suite CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # validation_suite/ importa i moduli di produzione (backend, apex_v2_engine,
      # convex_engine, ...) dalla root del repo — vedi validation_suite/conftest.py
      # per l'equivalente in esecuzione locale via pytest.
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r validation_suite/requirements-test.txt
      - name: Run Validation Suite (core_regression + kelly_stack + framework)
        run: |
          python -m pytest validation_suite/ -v
      - name: Test Convex Telegram Dry Run
        run: |
          python convex_telegram_reminder.py --dry-run
