name: Notifica Telegram Frontier Venture

on:
  schedule:
    - cron: '0 23 * * 1-5' # Dal Lunedì al Venerdì alle 23:00 UTC
  workflow_dispatch: # Permette avvio manuale immediato

jobs:
  send-venture-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Invia Notifica Telegram Frontier Venture
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python venture_telegram_reminder.py
