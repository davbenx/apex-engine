name: Aggiorna Dati Apex

on:
  schedule:
    # Era '0 23 * * *'. Dati reali (API actions/workflows/.../runs, 30 run):
    # il cron parte SEMPRE in ritardo rispetto all'orario programmato (mai piu'
    # vicino di ~1h45m), e il ritardo medio e' cresciuto da ~118min (inizio
    # settembre 2026) a ~192min (inizio ottobre 2026), ~+3min/giorno — in linea
    # con la nota ufficiale di GitHub che i workflow schedulati sono "best effort"
    # e il minuto :00 (inizio di ogni ora) e' il piu' congestionato. Spostato su
    # un minuto non tondo e un'ora piu' anticipata per guadagnare margine:
    # mitiga la latenza media, NON la elimina (il ritardo resta fuori dal nostro
    # controllo e la tendenza in crescita puo' riassorbire il margine in poche
    # settimane — se ricompare, l'unica soluzione definitiva e' un trigger
    # esterno via workflow_dispatch, non ulteriore tuning del cron). La
    # correttezza delle decisioni giorno/settimana/mese/trimestre NON dipende da
    # questo orario: e' garantita da compute_effective_run_dt in backend.py
    # indipendentemente da quanto il run slitti.
    - cron: '47 22 * * *' # ~22:47 UTC, minuto non tondo, margine su chiusura USA (20:00 UTC EDT / 21:00 UTC EST)
    # Trigger ridondante, non un secondo giorno: GitHub accoda ogni run
    # schedulato in modo indipendente, quindi il ritardo del primo e del
    # secondo non sono lo stesso numero — un giorno il primo puo' slittare di
    # 3h e il secondo di soli 40min, o viceversa. Con due trigger, vince (nel
    # senso di "fa il lavoro vero") quello che arriva per primo; l'altro
    # trova gia' tutto fatto e non fa nulla di nuovo. Sicuro perche' il motore
    # e' idempotente sullo stesso giorno effettivo (compute_should_decide
    # confronta last_decision_month, compute_executing_pending confronta la
    # barra di mercato, compute_weekly_due deduplica per settimana ISO) — SOLO
    # se i due run non si sovrappongono mai (vedi `concurrency` sotto, che
    # accoda il secondo finche' il primo non ha fatto commit/push: altrimenti
    # il secondo leggerebbe apex_data.json/portfolio.json ancora vecchi e
    # l'idempotenza non si applicherebbe).
    - cron: '52 23 * * *' # ~23:52 UTC, backup indipendente ~1h05m dopo il primo
  workflow_dispatch: # Permette avvio manuale

concurrency:
  group: update-data-apex
  cancel-in-progress: false # accoda, non cancella: il run in corso deve finire
  # (commit + push) prima che l'altro trigger ridondante parta, altrimenti i
  # due run leggerebbero lo stesso stato vecchio e l'idempotenza del motore
  # (vedi sopra) non avrebbe nulla da deduplicare.

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run Backend Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backend.py
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add apex_data.json portfolio.json equity.json || git add -A
          git commit -m "Aggiornamento dati, portfolio e Equity Curve" || echo "Nessuna modifica da pushare"
          git pull --rebase origin main || true
          git push
