name: Aggiorna Dati Apex

on:
  schedule:
    # Era '0 23 * * *'. Dati reali (API actions/workflows/.../runs, 30 run):
    # il cron parte SEMPRE in ritardo rispetto all'orario programmato (mai piu'
    # vicino di ~1h45m), e il ritardo medio e' cresciuto da ~118min (inizio
    # settembre 2026) a ~192min (inizio ottobre 2026), ~+3min/giorno — in linea
    # con la nota ufficiale di GitHub che i workflow schedulati sono "best effort"
    # e il minuto :00 (inizio di ogni ora) e' il piu' congestionato. Spostato su
    # un minuto non tondo e un'ora piu' anticipata per guadagnare margine:
    # mitiga la latenza media, NON la elimina (il ritardo resta fuori dal nostro
    # controllo e la tendenza in crescita puo' riassorbire il margine in poche
    # settimane — se ricompare, l'unica soluzione definitiva e' un trigger
    # esterno via workflow_dispatch, non ulteriore tuning del cron). La
    # correttezza delle decisioni giorno/settimana/mese/trimestre NON dipende da
    # questo orario: e' garantita da compute_effective_run_dt in backend.py
    # indipendentemente da quanto il run slitti.
    - cron: '47 22 * * *' # ~22:47 UTC, minuto non tondo, margine su chiusura USA (20:00 UTC EDT / 21:00 UTC EST)
  workflow_dispatch: # Permette avvio manuale

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run Backend Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backend.py
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add apex_data.json portfolio.json equity.json || git add -A
          git commit -m "Aggiornamento dati, portfolio e Equity Curve" || echo "Nessuna modifica da pushare"
          git pull --rebase origin main || true
          git push
